version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [benjaminhmlucas]
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [benjaminhmlucas]
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /dependencies/pm2
      - /dependencies/logrotate
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [benjaminhmlucas]
    groups:
      pm2-tools:
        patterns: ['*']
