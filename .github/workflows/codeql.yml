name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: '${{ runner.temp }}/codeql-results'
      - name: Block medium and higher security findings
        env:
          SARIF_DIRECTORY: '${{ runner.temp }}/codeql-results'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          reports = list(Path(os.environ['SARIF_DIRECTORY']).glob('*.sarif'))
          if not reports:
              raise SystemExit('CodeQL produced no SARIF report')
          blocked = 0
          for report in reports:
              for run in json.loads(report.read_text())['runs']:
                  rules = {r['id']: r for r in run['tool']['driver']['rules']}
                  for result in run.get('results', []):
                      severity = float(rules[result['ruleId']].get('properties', {}).get('security-severity', '0'))
                      blocked += result.get('level') == 'error' or severity >= 4
          print(f'Blocking CodeQL findings: {blocked}')
          raise SystemExit(bool(blocked))
          PY
