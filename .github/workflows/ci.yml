name: Verify source template
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_release.py
      - run: python -m coverage run -m pytest tests -v --durations=10 --basetemp="${{ runner.temp }}/native-tests"
      - name: Preserve failed native daemon diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-diagnostics
          path: |
            ${{ runner.temp }}/native-tests/**/pm2.log
            ${{ runner.temp }}/native-tests/**/command.log
            ${{ runner.temp }}/native-tests/**/control-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - run: python -m coverage json
      - run: python -m coverage report
      - run: python scripts/check_coverage.py coverage.json
      - run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 --test-coverage-include=ecosystem.config.js --test-coverage-include=scripts/pm2_namespace.cjs --test-coverage-include=scripts/pm2_recovery.cjs --test-coverage-include=scripts/recover_pm2.cjs tests/test_ecosystem.cjs tests/test_pm2_namespace.cjs tests/test_pm2_recovery.cjs
  quality:
    name: Quality and dependency audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Low-confidence subprocess findings are reviewed in docs/security-review.md;
      # all medium/high findings block CI, with no vulnerability ID exclusions.
      - run: bandit -r . -c pyproject.toml -ll
      - run: python -m pip_audit --strict
      - run: npm ci --ignore-scripts --prefix dependencies/pm2
      - run: npm audit --prefix dependencies/pm2 --audit-level=low
      - run: npm ci --ignore-scripts --prefix dependencies/logrotate
      - run: npm audit --prefix dependencies/logrotate --audit-level=low
