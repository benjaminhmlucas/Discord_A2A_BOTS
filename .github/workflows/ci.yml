name: Verify source template
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_release.py
      - run: python -m coverage run -m pytest tests -v --durations=10 --basetemp="${{ runner.temp }}/native-tests"
      - name: Preserve failed native daemon diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-diagnostics
          path: |
            ${{ runner.temp }}/native-tests/**/pm2.log
            ${{ runner.temp }}/native-tests/**/command.log
            ${{ runner.temp }}/native-tests/**/control-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - run: python -m coverage json
      - run: python -m coverage report
      - run: python scripts/check_coverage.py coverage.json
      - run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 --test-coverage-include=ecosystem.config.js --test-coverage-include=scripts/pm2_namespace.cjs --test-coverage-include=scripts/pm2_recovery.cjs --test-coverage-include=scripts/recover_pm2.cjs --test-coverage-include=scripts/hidden_windows.cjs tests/test_ecosystem.cjs tests/test_pm2_namespace.cjs tests/test_pm2_recovery.cjs tests/test_hidden_windows.cjs
  quality:
    name: Quality and dependency audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_ci_policy.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Low-confidence subprocess findings are reviewed in docs/security-review.md;
      # all medium/high findings block CI, with no vulnerability ID exclusions.
      - run: bandit -r . -c pyproject.toml -ll
      - run: python -m pip_audit --strict
      - run: npm ci --ignore-scripts --prefix dependencies/pm2
      - run: npm audit --prefix dependencies/pm2 --audit-level=low
      - run: npm ci --ignore-scripts --prefix dependencies/logrotate
      - run: npm audit --prefix dependencies/logrotate --audit-level=low
  # Actual native credential stores with disposable entries; no repository secrets.
  credentials-linux:
    name: Native credentials (Linux Secret Service)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus
      - run: python -m pip install -r requirements-dev.txt
      # A private session bus and a throwaway unlocked login keyring as the default alias.
      - run: |
          mkdir -p "$HOME/.local/share/keyrings"
          printf login > "$HOME/.local/share/keyrings/default"
          dbus-run-session -- sh -ec 'printf botbridge-ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null; python -m pytest tests/test_credentials.py tests/test_auth_policy.py tests/test_oauth_grants.py -v'
        env:
          BOTBRIDGE_TEST_NATIVE_CREDENTIALS: '1'
  credentials-macos:
    name: Native credentials (macOS Keychain)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      # A disposable unlocked default keychain; the bridge itself never unlocks or prompts.
      - run: |
          chain="$RUNNER_TEMP/botbridge-ci.keychain-db"
          security create-keychain -p botbridge-ci "$chain"
          security set-keychain-settings "$chain"
          security unlock-keychain -p botbridge-ci "$chain"
          security list-keychains -d user -s "$chain"
          security default-keychain -d user -s "$chain"
          python -m pytest tests/test_credentials.py tests/test_auth_policy.py tests/test_oauth_grants.py -v
        env:
          BOTBRIDGE_TEST_NATIVE_CREDENTIALS: '1'
