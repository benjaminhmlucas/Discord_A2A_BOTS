name: Verify source template
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_release.py
      - run: python -m coverage run -m pytest tests -v --durations=10 --basetemp="${{ runner.temp }}/native-tests"
      - name: Preserve failed native daemon diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-diagnostics
          path: |
            ${{ runner.temp }}/native-tests/**/pm2.log
            ${{ runner.temp }}/native-tests/**/command.log
            ${{ runner.temp }}/native-tests/**/control-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
      - run: python -m coverage json
      - run: python -m coverage report
      - run: python scripts/check_coverage.py coverage.json
      - run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 --test-coverage-include=ecosystem.config.js --test-coverage-include=scripts/pm2_namespace.cjs --test-coverage-include=scripts/pm2_recovery.cjs --test-coverage-include=scripts/recover_pm2.cjs tests/test_ecosystem.cjs tests/test_pm2_namespace.cjs tests/test_pm2_recovery.cjs
