<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BotBridge Control</title>
  <link rel="stylesheet" href="/ui/control.css">
  <script type="module" src="/ui/control.js"></script>
</head>
<body>
  <aside>
    <div class="brand"><span class="mark">B</span> BotBridge</div>
    <div class="local">LOCAL CONTROL</div>
    <nav aria-label="Settings"></nav>
    <p class="foot">Your bridge, on this computer.</p>
  </aside>
  <main>
    <header><span class="eyebrow">CONTROL CENTER</span><span class="badge">Local session</span></header>
    <h1 id="title">Setup</h1>
    <p id="description"></p>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="content"></section>
  </main>
</body>
</html>
